<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprobaciones – SiniestrosAuto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar"></div>

  <div class="flex-1 flex flex-col overflow-auto">

    <div class="bg-white border-b border-gray-200 px-8 py-4">
      <div class="flex items-center gap-2 text-sm text-gray-500 mb-1">
        <a href="dashboard.html" class="hover:text-blue-600">Panel</a>
        <span>›</span>
        <span class="text-gray-800 font-medium">Aprobaciones</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Aprobaciones Pendientes</h1>
      <p class="text-gray-500 text-sm">Revisa y resuelve los siniestros que requieren autorización.</p>
    </div>

    <div class="p-8">

      <!-- Stats rápidas -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center">
          <p id="statPendientes" class="text-2xl font-bold text-yellow-500">–</p>
          <p class="text-xs text-gray-500 mt-1">Pendientes</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center">
          <p id="statAprobados" class="text-2xl font-bold text-green-500">–</p>
          <p class="text-xs text-gray-500 mt-1">Aprobados este mes</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center">
          <p id="statRechazados" class="text-2xl font-bold text-red-500">–</p>
          <p class="text-xs text-gray-500 mt-1">Rechazados este mes</p>
        </div>
      </div>

      <!-- Notificación -->
      <div id="alertGlobal" class="hidden text-sm px-4 py-3 rounded-lg mb-5"></div>

      <!-- Lista de pendientes -->
      <div id="listaPendientes" class="space-y-4"></div>
    </div>
  </div>
</div>

<script src="../js/session.js"></script>
<script src="../js/nav.js"></script>
<script>
  SESSION.requerir('aprobaciones.html');
  document.getElementById('sidebar').innerHTML = renderNav('aprobaciones.html');

  const sesion       = JSON.parse(sessionStorage.getItem('siniestros_session') || '{}');
  const ID_USUARIO   = sesion.id_usuario || '';
  const TIPO_USUARIO = sesion.tipo       || '';

  function formatSiniestro(id) {
    return 'SIN-' + String(id).padStart(4, '0');
  }

  function showGlobal(msg, tipo) {
    const el = document.getElementById('alertGlobal');
    el.className = `text-sm px-4 py-3 rounded-lg mb-5 ${tipo === 'error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-green-50 border border-green-200 text-green-700'}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildCard(s) {
    const num          = formatSiniestro(s.id_siniestro);
    const fechaDisplay = (s.fecha || '').split('-').reverse().join('/');
    const vehiculo     = `${s.marca || ''} ${s.modelo || ''} ${s.placas || ''}`.trim();
    const descripcion  = (s.descripcion || '').replace(/"/g, '&quot;');
    return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5" data-id="${s.id_siniestro}">
      <div class="flex items-start justify-between mb-4">
        <div>
          <p class="font-mono text-xs text-blue-600 font-semibold mb-1">${num}</p>
          <div class="flex items-center gap-2 mb-1">
            <span class="font-semibold text-gray-800">${s.nombre_asegurado || ''}</span>
            <span class="card-badge text-xs px-2 py-0.5 bg-yellow-100 text-yellow-700 rounded-full font-medium">En revisión</span>
          </div>
          <p class="text-xs text-gray-500">Póliza <span class="font-mono">${s.numero_poliza || ''}</span> · ${s.nombre_compania || ''} · ${vehiculo}</p>
          <p class="text-xs text-gray-400 mt-0.5">Registrado el ${fechaDisplay} · Ajustador: ${s.nombre_ajustador || ''}</p>
        </div>
        <a href="detalle_siniestro.html?id=${s.id_siniestro}" class="text-blue-600 text-xs hover:underline font-medium">Ver detalle →</a>
      </div>

      <p class="text-sm text-gray-600 mb-4 bg-gray-50 rounded-lg p-3 italic">
        "${s.descripcion || ''}"
      </p>

      <div class="border-t border-gray-100 pt-4">
        <p class="text-xs font-semibold text-gray-600 mb-3">Resolución</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Tipo *</label>
            <select class="inp-tipo w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Seleccionar</option>
              <option value="rechazado">Rechazado</option>
              <option value="aceptado">Aceptado</option>
              <option value="con_deducible">Aceptado con deducible</option>
              <option value="sin_deducible">Aceptado sin deducible</option>
              <option value="reparacion">Aplica reparación</option>
              <option value="perdida_total">Pérdida total</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Monto ($)</label>
            <input type="number" placeholder="0.00" class="inp-monto w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Monto deducible ($)</label>
            <input type="number" placeholder="0.00" class="inp-deducible w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Fecha compromiso</label>
            <input type="date" class="inp-fecha w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium text-gray-600 mb-1">Observaciones</label>
            <textarea rows="2" placeholder="Notas adicionales..." class="inp-obs w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="resolver(this, ${s.id_siniestro})"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors">
            Guardar Resolución
          </button>
          <a href="seguimiento.html?id=${s.id_siniestro}"
            class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-xs font-semibold transition-colors">
            Ver Chat
          </a>
        </div>
      </div>
    </div>`;
  }

  async function cargarPendientes() {
    try {
      const resp = await fetch('../php/listar_pendientes.php');
      const data = await resp.json();
      const lista = document.getElementById('listaPendientes');

      if (!data.ok || !data.pendientes.length) {
        lista.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-10 text-center">
            <p class="text-gray-400 font-medium">No hay siniestros pendientes de aprobación.</p>
          </div>`;
        document.getElementById('statPendientes').textContent = '0';
        return;
      }

      lista.innerHTML = data.pendientes.map(buildCard).join('');
      document.getElementById('statPendientes').textContent = data.pendientes.length;
    } catch (e) {
      document.getElementById('listaPendientes').innerHTML = `
        <div class="bg-white rounded-xl shadow-sm border border-red-200 p-10 text-center">
          <p class="text-red-500 font-medium">Error al cargar los pendientes.</p>
        </div>`;
    }
  }

  async function cargarStats() {
    const qs = new URLSearchParams({ id_usuario: ID_USUARIO, tipo_usuario: TIPO_USUARIO }).toString();
    try {
      const resp = await fetch(`../php/listar_siniestros.php?${qs}`);
      const data = await resp.json();
      if (data.ok) {
        const aprobadosEstados = ['Aceptado', 'Aceptado con deducible', 'Aceptado sin deducible', 'Aplica reparación'];
        const aprobados  = data.siniestros.filter(s => aprobadosEstados.includes(s.estado_actual)).length;
        const rechazados = data.siniestros.filter(s => s.estado_actual === 'Rechazado').length;
        document.getElementById('statAprobados').textContent  = aprobados;
        document.getElementById('statRechazados').textContent = rechazados;
      }
    } catch (e) {}
  }

  async function resolver(btn, idSiniestro) {
    const card = btn.closest('[data-id]');
    const tipo = card.querySelector('.inp-tipo').value;
    if (!tipo) {
      showGlobal('Selecciona un tipo de resolución antes de guardar.', 'error');
      return;
    }

    const monto     = card.querySelector('.inp-monto').value;
    const deducible = card.querySelector('.inp-deducible').value;
    const fecha     = card.querySelector('.inp-fecha').value;
    const obs       = card.querySelector('.inp-obs').value;

    const body = new URLSearchParams({
      id_siniestro:             idSiniestro,
      id_usuario:               ID_USUARIO,
      tipo_resolucion:          tipo,
      monto_pago:               monto,
      monto_deducible_aplicado: deducible,
      fecha_resolucion:         new Date().toISOString().split('T')[0],
      fecha_compromiso:         fecha,
      observaciones:            obs,
    });

    btn.disabled    = true;
    btn.textContent = 'Guardando…';

    try {
      const resp = await fetch('../php/guardar_aprobacion.php', { method: 'POST', body });
      const data = await resp.json();

      if (data.ok) {
        card.classList.add('opacity-50', 'pointer-events-none');
        const badge = card.querySelector('.card-badge');
        if (badge) {
          badge.className = 'card-badge text-xs px-2 py-0.5 bg-green-100 text-green-700 rounded-full font-medium';
          badge.textContent = 'Resuelto';
        }
        showGlobal(data.mensaje || 'Resolución guardada correctamente.', 'success');
        // Actualizar stats
        cargarStats();
      } else {
        btn.disabled    = false;
        btn.textContent = 'Guardar Resolución';
        showGlobal(data.mensaje || 'Error al guardar la resolución.', 'error');
      }
    } catch (e) {
      btn.disabled    = false;
      btn.textContent = 'Guardar Resolución';
      showGlobal('Error de conexión al guardar la resolución.', 'error');
    }
  }

  cargarPendientes();
  cargarStats();
</script>
</body>
</html>
