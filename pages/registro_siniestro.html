<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Siniestro – SiniestrosAuto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar"></div>

  <div class="flex-1 flex flex-col overflow-auto">

    <!-- Header -->
    <div class="bg-white border-b border-gray-200 px-8 py-4">
      <div class="flex items-center gap-2 text-sm text-gray-500 mb-1">
        <a href="dashboard.html" class="hover:text-blue-600">Panel</a>
        <span>›</span>
        <span class="text-gray-800 font-medium">Registrar Siniestro</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Registrar Siniestro</h1>
    </div>

    <div class="p-8">
      <div class="max-w-3xl mx-auto">

        <!-- Alerta -->
        <div id="alertMsg" class="hidden text-sm px-4 py-3 rounded-lg mb-5"></div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-5">
          <h2 class="text-base font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-100">Datos del Cliente y Unidad</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Cliente (Asegurado) *</label>
              <select id="cliente" onchange="cargarDatosCliente()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Seleccionar cliente</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Vehículo *</label>
              <select id="vehiculo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Selecciona primero un cliente</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Número de Póliza</label>
              <input id="poliza" type="text" readonly placeholder="Se carga automáticamente"
                class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-500 cursor-not-allowed">
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Compañía de Seguros</label>
              <input id="compania" type="text" readonly placeholder="Se carga automáticamente"
                class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-500 cursor-not-allowed">
            </div>

          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-5">
          <h2 class="text-base font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-100">Datos del Siniestro</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Fecha *</label>
              <input id="fecha" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Hora *</label>
              <input id="hora" type="time" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-gray-700 mb-1">Ubicación *</label>
              <input id="ubicacion" type="text" placeholder="Ej. Av. Constitución 1000, Monterrey, NL"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-gray-700 mb-1">¿Hubo otras unidades involucradas?</label>
              <select id="otras_unidades" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="no">No</option>
                <option value="si">Sí</option>
              </select>
            </div>

            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-gray-700 mb-1">Descripción del siniestro *</label>
              <textarea id="descripcion" rows="4" placeholder="Describe detalladamente lo que ocurrió..."
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </div>

          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-5">
          <h2 class="text-base font-semibold text-gray-800 mb-1 pb-2 border-b border-gray-100">Material Multimedia</h2>
          <p class="text-xs text-gray-400 mb-4">Puedes subir múltiples fotos y videos del siniestro.</p>

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Imágenes del siniestro</label>
            <input type="file" id="imagenes" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" multiple onchange="previsualizarImagenes(this)"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-500 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 file:text-xs cursor-pointer mb-3">
            <div id="previewImagenes" class="grid grid-cols-3 gap-2"></div>
          </div>

          <div class="mt-4">
            <label class="block text-xs font-medium text-gray-700 mb-1">Videos del siniestro <span class="text-gray-400">(opcional)</span></label>
            <input type="file" id="videos" accept="video/mp4,video/avi,video/quicktime,video/x-ms-wmv,video/x-matroska" multiple
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-500 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 file:text-xs cursor-pointer">
          </div>
        </div>

        <div class="flex gap-3">
          <button onclick="guardarSiniestro()"
            class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
            Guardar Siniestro
          </button>
          <a href="dashboard.html"
            class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors text-sm text-center">
            Cancelar
          </a>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/session.js"></script>
<script src="../js/nav.js"></script>
<script>
  SESSION.requerir('registro_siniestro.html');
  document.getElementById('sidebar').innerHTML = renderNav('registro_siniestro.html');

  let idAseguradoActual = null;
  let idPolizaActual    = null;

  async function cargarClientes() {
    try {
      const resp = await fetch('../php/listar_clientes.php');
      const data = await resp.json();
      const sel  = document.getElementById('cliente');
      if (data.ok && Array.isArray(data.clientes)) {
        data.clientes.forEach(c => {
          const opt       = document.createElement('option');
          opt.value       = c.id_usuario;
          opt.textContent = c.nombre + ' ' + c.apellidos;
          sel.appendChild(opt);
        });
      }
    } catch (e) { console.error('Error cargando clientes:', e); }
  }

  async function cargarDatosCliente() {
    const idUsuario = document.getElementById('cliente').value;
    document.getElementById('vehiculo').innerHTML = '<option value="">Cargando...</option>';
    document.getElementById('poliza').value       = '';
    document.getElementById('compania').value     = '';
    idAseguradoActual = null;
    idPolizaActual    = null;

    if (!idUsuario) {
      document.getElementById('vehiculo').innerHTML = '<option value="">Selecciona primero un cliente</option>';
      return;
    }

    try {
      const uResp = await fetch('../php/consultar_usuario.php?id=' + idUsuario);
      const uData = await uResp.json();
      if (!uData.ok || !uData.usuario || !uData.usuario.id_asegurado) {
        document.getElementById('vehiculo').innerHTML = '<option value="">Sin vehículos registrados</option>';
        return;
      }
      idAseguradoActual = uData.usuario.id_asegurado;

      const [vResp, pResp] = await Promise.all([
        fetch('../php/listar_vehiculos_asegurado.php?id=' + idAseguradoActual),
        fetch('../php/listar_polizas_asegurado.php?id='   + idAseguradoActual),
      ]);
      const vData = await vResp.json();
      const pData = await pResp.json();

      const selV = document.getElementById('vehiculo');
      selV.innerHTML = '<option value="">Seleccionar vehículo</option>';
      if (vData.ok && Array.isArray(vData.vehiculos) && vData.vehiculos.length > 0) {
        vData.vehiculos.forEach(v => {
          const opt       = document.createElement('option');
          opt.value       = v.id_unidad;
          opt.textContent = `${v.marca} ${v.modelo} ${v.anio} · ${v.placas}`;
          selV.appendChild(opt);
        });
        if (vData.vehiculos.length === 1) selV.selectedIndex = 1;
      } else {
        selV.innerHTML = '<option value="">Sin vehículos registrados</option>';
      }

      if (pData.ok && Array.isArray(pData.polizas) && pData.polizas.length > 0) {
        const pol = pData.polizas[0];
        document.getElementById('poliza').value   = pol.numero_poliza   || '';
        document.getElementById('compania').value = pol.nombre_compania || '';
        idPolizaActual = pol.id_poliza;
      } else {
        document.getElementById('poliza').value = 'Sin póliza activa';
      }

    } catch (e) {
      console.error('Error cargando datos del cliente:', e);
      document.getElementById('vehiculo').innerHTML = '<option value="">Error al cargar vehículos</option>';
    }
  }

  function previsualizarImagenes(input) {
    const container = document.getElementById('previewImagenes');
    container.innerHTML = '';
    Array.from(input.files).forEach(file => {
      const url = URL.createObjectURL(file);
      container.innerHTML += `<img src="${url}" class="rounded-lg w-full h-20 object-cover border border-gray-200">`;
    });
  }

  function showAlert(msg, tipo = 'error') {
    const el = document.getElementById('alertMsg');
    el.className = `text-sm px-4 py-3 rounded-lg mb-5 ${tipo === 'error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-green-50 border border-green-200 text-green-700'}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function guardarSiniestro() {
    const clienteVal  = document.getElementById('cliente').value;
    const vehiculoVal = document.getElementById('vehiculo').value;
    const fecha       = document.getElementById('fecha').value;
    const hora        = document.getElementById('hora').value;
    const ubicacion   = document.getElementById('ubicacion').value.trim();
    const descripcion = document.getElementById('descripcion').value.trim();

    if (!clienteVal || !vehiculoVal || !fecha || !hora || !ubicacion || !descripcion) {
      showAlert('Por favor completa todos los campos obligatorios.');
      return;
    }
    if (!idPolizaActual) {
      showAlert('El cliente no tiene una póliza activa. No se puede registrar el siniestro.');
      return;
    }

    const sesion = JSON.parse(sessionStorage.getItem('siniestros_session') || '{}');
    if (!sesion.id_usuario) {
      showAlert('No se pudo obtener la sesión. Por favor inicia sesión de nuevo.');
      return;
    }

    const imgs = document.getElementById('imagenes').files;
    const tiposImg = ['image/jpeg','image/jpg','image/png','image/gif','image/webp'];
    for (const f of imgs) {
      if (!tiposImg.includes(f.type)) {
        showAlert('Solo se permiten imágenes (JPG, PNG, GIF, WEBP). Archivo no válido: ' + f.name);
        return;
      }
    }

    const vids = document.getElementById('videos').files;
    const tiposVid = ['video/mp4','video/avi','video/quicktime','video/x-ms-wmv','video/x-matroska'];
    for (const f of vids) {
      if (!tiposVid.includes(f.type)) {
        showAlert('Solo se permiten videos (MP4, AVI, MOV, WMV, MKV). Archivo no válido: ' + f.name);
        return;
      }
    }

    const otras = document.getElementById('otras_unidades').value === 'si' ? '1' : '0';

    const formData = new FormData();
    formData.append('id_poliza',      idPolizaActual);
    formData.append('id_unidad',      vehiculoVal);
    formData.append('id_usuario',     sesion.id_usuario);
    formData.append('fecha',          fecha);
    formData.append('hora',           hora);
    formData.append('ubicacion',      ubicacion);
    formData.append('descripcion',    descripcion);
    formData.append('otras_unidades', otras);

    for (const f of imgs) formData.append('imagenes[]', f);
    for (const f of vids) formData.append('videos[]', f);

    try {
      const resp = await fetch('../php/registro_siniestro.php', { method: 'POST', body: formData });
      const data = await resp.json();
      if (data.ok) {
        showAlert(data.mensaje || 'Siniestro registrado exitosamente.', 'success');
        setTimeout(() => window.location.href = 'consulta.html', 1800);
      } else {
        showAlert(data.mensaje || 'Error al registrar el siniestro.');
      }
    } catch (e) {
      showAlert('Error de conexión al registrar el siniestro.');
    }
  }

  cargarClientes();
</script>
</body>
</html>
